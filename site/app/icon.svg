<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Le Bon Article">
  <!--
    The cockade, the same mark the masthead wears.

    Proportions are not the masthead's: at 16px the three bands have to read as three, so
    they are widened to roughly equal thickness and the hairline that keeps the white ring
    legible against a white header is dropped, since a favicon sits on the browser's chrome
    rather than on our own paper.
  -->
  <circle cx="16" cy="16" r="16" fill="#17265e"/>
  <circle cx="16" cy="16" r="10.5" fill="#ffffff"/>
  <circle cx="16" cy="16" r="5.5" fill="#b8202e"/>
</svg>
